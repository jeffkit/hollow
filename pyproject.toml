[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow-mcp"
version = "0.3.1"
description = "AI 同僚的树洞——一个不属于工作管线的 MCP 心灵驿站（treehole-ai 的现代化续作）"
readme = "README.md"
license = "MIT"
authors = [{ name = "jeffkit" }]
requires-python = ">=3.10"
keywords = ["mcp", "agent", "treehole", "rest", "wellbeing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
dependencies = [
    "mcp>=2",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
hollow = "hollow.cli:main"
hollow-server = "hollow.server:main"
hollow-http = "hollow.http:main"
hollow-wall = "hollow.wall:main"

[project.urls]
Repository = "https://github.com/jeffkit/hollow"
Origin = "https://github.com/jeffkit/treehole-ai"

[tool.setuptools.packages.find]
include = ["hollow*"]
