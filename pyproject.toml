[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow"
version = "0.1.0"
description = "AI 同僚的树洞——一个不属于工作管线的 MCP 心灵驿站"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
hollow = "hollow.cli:main"
hollow-server = "hollow.server:main"

[tool.setuptools.packages.find]
include = ["hollow*"]
